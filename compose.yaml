name: parkscan

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkscan}
      POSTGRES_USER: ${POSTGRES_USER:-parkscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkscan_net

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - parkscan_net

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8001}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - parkscan_net

  # Service d'inférence (torch CPU). Les poids produit sont dans ./ml/weights (hors git).
  ml:
    build:
      context: ./ml
      target: dev
    environment:
      ML_APP_ENV: ${APP_ENV:-dev}
      ML_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ML_TORCH_THREADS: ${ML_TORCH_THREADS:-4}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      # Registre de modèles (profil mlops) : auto = MLflow si joignable, sinon poids locaux ./ml/weights
      ML_MODEL_SOURCE: ${ML_MODEL_SOURCE:-auto}
      ML_MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    ports:
      - "${ML_PORT:-8002}:8002"
    volumes:
      - ./ml:/app
      # Images de démonstration (tests sur vrais modèles, banc de latence)
      - ./backend/app/seed/demo_images:/opt/demo_images:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - parkscan_net

  # Simulateur d'agent de bord : rejoue les images de démo vers l'API (profil sim, usage ponctuel).
  edge-sim:
    build:
      context: ./edge
      target: dev
    profiles: ["sim"]
    environment:
      EDGE_API_URL: http://backend:8001
      EDGE_API_KEY: ${EDGE_API_KEY:-}
    volumes:
      - ./backend/app/seed/demo_images:/opt/demo_images:ro
    command: ["--dir", "/opt/demo_images", "--interval", "0.5"]
    networks:
      - parkscan_net

  # Stockage objets compatible S3 (dev / démo). En production : S3 managé.
  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?définir GARAGE_RPC_SECRET dans .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?définir GARAGE_ADMIN_TOKEN dans .env (openssl rand -base64 32)}
    ports:
      - "${S3_HOST_PORT:-3900}:3900"
    volumes:
      # Montage du dossier (pas du fichier seul) : un fichier réécrit casse le montage sous Docker Desktop.
      - ./garage:/etc/garage:ro
      - garage_data:/var/lib/garage
    networks:
      - parkscan_net

  # Initialisation idempotente : disposition du nœud, buckets, clé d'accès (API d'administration).
  garage-init:
    image: python:3.12-slim
    command: ["python", "-I", "/opt/garage/init.py"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-20000000000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?définir S3_SECRET_KEY dans .env}
      BUCKETS: "${S3_BUCKET_CAPTURES:-parkscan-captures} ${S3_BUCKET_DATASET:-parkscan-dataset} ${S3_BUCKET_MLFLOW:-mlflow}"
    volumes:
      - ./garage:/opt/garage:ro
    depends_on:
      garage:
        condition: service_started
    networks:
      - parkscan_net

  # --- Profil mlops : registre de modèles MLflow (base dédiée, artefacts servis par MLflow vers Garage)
  mlflow-db:
    image: postgres:16-alpine
    profiles: ["mlops"]
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-change-me-mlflow}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkscan_net

  mlflow:
    build:
      context: ./mlflow
    profiles: ["mlops"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:-change-me-mlflow}@mlflow-db:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://${S3_BUCKET_MLFLOW:-mlflow}/
      # Seul MLflow parle au S3 : les clients (ml, airflow) passent par lui (artefacts proxifiés).
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-garage}
      # MLflow 3 rejette les en-têtes Host inconnus (anti-rebinding DNS) : nom de service Docker + hôte local
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parkscan_net

volumes:
  db_data:
  garage_data:
  mlflow_db_data:

networks:
  parkscan_net:
    name: parkscan_net
