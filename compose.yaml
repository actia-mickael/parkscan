name: parkscan

# --- Profil mlops : Airflow 3 (orchestration), base de configuration commune ------------------------
x-airflow-common: &airflow-common
  build:
    context: ./airflow
  profiles: ["mlops"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-change-me-airflow}@airflow-db:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-airflow-jwt}
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    PYTHONPATH: /opt/airflow/plugins
    # Cibles des DAG
    PARKSCAN_BACKEND_URL: http://backend:8001
    PARKSCAN_ML_URL: http://ml:8002
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    PARKSCAN_TRAINER_IMAGE: ${TRAINER_IMAGE:-parkscan-trainer:dev}
    # Transmis au conteneur d'entraînement (jeu de données sur le S3)
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_REGION: ${S3_REGION:-garage}
    S3_BUCKET_DATASET: ${S3_BUCKET_DATASET:-parkscan-dataset}
    TRAIN_EPOCHS: ${TRAIN_EPOCHS:-6}
    TRAIN_MIN_PER_CLASS: ${TRAIN_MIN_PER_CLASS:-20}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - airflow_auth:/opt/airflow/auth
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - parkscan_net

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkscan}
      POSTGRES_USER: ${POSTGRES_USER:-parkscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkscan_net

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - parkscan_net

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8001}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - parkscan_net

  # Service d'inférence (torch CPU). Les poids produit sont dans ./ml/weights (hors git).
  ml:
    build:
      context: ./ml
      target: dev
    environment:
      ML_APP_ENV: ${APP_ENV:-dev}
      ML_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ML_TORCH_THREADS: ${ML_TORCH_THREADS:-4}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      # Registre de modèles (profil mlops) : auto = MLflow si joignable, sinon poids locaux ./ml/weights
      ML_MODEL_SOURCE: ${ML_MODEL_SOURCE:-auto}
      ML_MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    ports:
      - "${ML_PORT:-8002}:8002"
    volumes:
      - ./ml:/app
      # Images de démonstration (tests sur vrais modèles, banc de latence)
      - ./backend/app/seed/demo_images:/opt/demo_images:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - parkscan_net

  # Simulateur d'agent de bord : rejoue les images de démo vers l'API (profil sim, usage ponctuel).
  edge-sim:
    build:
      context: ./edge
      target: dev
    profiles: ["sim"]
    environment:
      EDGE_API_URL: http://backend:8001
      EDGE_API_KEY: ${EDGE_API_KEY:-}
    volumes:
      - ./backend/app/seed/demo_images:/opt/demo_images:ro
    command: ["--dir", "/opt/demo_images", "--interval", "0.5"]
    networks:
      - parkscan_net

  # Stockage objets compatible S3 (dev / démo). En production : S3 managé.
  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?définir GARAGE_RPC_SECRET dans .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?définir GARAGE_ADMIN_TOKEN dans .env (openssl rand -base64 32)}
    ports:
      - "${S3_HOST_PORT:-3900}:3900"
    volumes:
      # Montage du dossier (pas du fichier seul) : un fichier réécrit casse le montage sous Docker Desktop.
      - ./garage:/etc/garage:ro
      - garage_data:/var/lib/garage
    networks:
      - parkscan_net

  # Initialisation idempotente : disposition du nœud, buckets, clé d'accès (API d'administration).
  garage-init:
    image: python:3.12-slim
    command: ["python", "-I", "/opt/garage/init.py"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-20000000000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?définir S3_SECRET_KEY dans .env}
      BUCKETS: "${S3_BUCKET_CAPTURES:-parkscan-captures} ${S3_BUCKET_DATASET:-parkscan-dataset} ${S3_BUCKET_MLFLOW:-mlflow}"
    volumes:
      - ./garage:/opt/garage:ro
    depends_on:
      garage:
        condition: service_started
    networks:
      - parkscan_net

  # --- Profil mlops : registre de modèles MLflow (base dédiée, artefacts servis par MLflow vers Garage)
  mlflow-db:
    image: postgres:16-alpine
    profiles: ["mlops"]
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-change-me-mlflow}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkscan_net

  mlflow:
    build:
      context: ./mlflow
    profiles: ["mlops"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:-change-me-mlflow}@mlflow-db:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://${S3_BUCKET_MLFLOW:-mlflow}/
      # Seul MLflow parle au S3 : les clients (ml, airflow) passent par lui (artefacts proxifiés).
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-garage}
      # MLflow 3 rejette les en-têtes Host inconnus (anti-rebinding DNS) : nom de service Docker + hôte local
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parkscan_net

  # Image d'entraînement (cible trainer de ml/Dockerfile) : construite par compose, lancée par Airflow.
  trainer:
    build:
      context: ./ml
      target: trainer
    image: ${TRAINER_IMAGE:-parkscan-trainer:dev}
    profiles: ["tools"]
    command: ["python", "-m", "training.train_brand", "--help"]
    networks:
      - parkscan_net

  airflow-db:
    image: postgres:16-alpine
    profiles: ["mlops"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-change-me-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkscan_net

  # Migre la base d'Airflow et fixe le mot de passe de l'administrateur (gestionnaire d'auth simple).
  airflow-init:
    <<: *airflow-common
    # En root : les volumes nommés naissent propriété de root ; on les rend à l'utilisateur airflow.
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/airflow/auth /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/auth /opt/airflow/logs
        printf '{"%s": "%s"}' "${AIRFLOW_ADMIN_USER:-admin}" "${AIRFLOW_ADMIN_PASSWORD:-change-me-airflow}" > /opt/airflow/auth/passwords.json
        chown "${AIRFLOW_UID:-50000}:0" /opt/airflow/auth/passwords.json
        su airflow -s /bin/bash -c "airflow db migrate"
        echo "[airflow-init] base migrée, utilisateur ${AIRFLOW_ADMIN_USER:-admin} prêt"
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Les tâches s'exécutent ici (LocalExecutor) : accès au socket Docker pour lancer l'image trainer.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - airflow_auth:/opt/airflow/auth
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow-apiserver:
        condition: service_healthy

volumes:
  db_data:
  garage_data:
  mlflow_db_data:
  airflow_db_data:
  airflow_logs:
  airflow_auth:

networks:
  parkscan_net:
    name: parkscan_net
