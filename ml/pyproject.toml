[project]
name = "parkscan-ml"
version = "0.1.0"
description = "ParkScan AI - service d'inférence (plaque, OCR, véhicule, marque)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "numpy>=1.26",
    "pillow>=10.4",
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "fast-plate-ocr[onnx]>=1.1",
    "mlflow-skinny>=3.17",
]

[project.optional-dependencies]
# Image trainer : lecture du jeu de données sur le S3
train = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parkscan_ml", "training"]

# Roues torch CPU uniquement : pas de bibliothèques CUDA (image 5 fois plus légère).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
