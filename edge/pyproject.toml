[project]
name = "parkscan-edge"
version = "0.1.0"
description = "ParkScan AI - agent de bord (caméra → API) et simulateur"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.10", "numpy>=1.26"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
parkscan-edge-sim = "parkscan_edge.simulator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parkscan_edge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF002", "RUF003"]
