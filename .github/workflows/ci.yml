name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parkscan
          POSTGRES_USER: parkscan
          POSTGRES_PASSWORD: parkscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkscan -d parkscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: parkscan
      POSTGRES_USER: parkscan
      POSTGRES_PASSWORD: parkscan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Installer les dépendances
        run: uv sync --frozen --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Composition Docker (validation de tous les profils)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider compose.yaml avec les variables d'exemple
        run: |
          cp .env.example .env
          docker compose --profile mlops --profile tools --profile sim config -q

  edge:
    name: Agent de bord (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen --extra dev
      - run: |
          uv run ruff check .
          uv run ruff format --check .

  images:
    name: Images de production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (prod)
        run: docker build --target prod -t parkscan-backend:ci ./backend
      - name: Build frontend (prod)
        run: docker build --target prod -t parkscan-frontend:ci ./frontend
