name: ML

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]

jobs:
  ml:
    name: Service ML (lint + tests simulés)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Installer les dépendances (torch CPU)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (pipeline simulé)
        run: uv run pytest -q

  image:
    name: Image ML (prod)
    runs-on: ubuntu-latest
    needs: [ml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ml (prod, avec préchargement des modèles génériques)
        run: docker build --target prod -t parkscan-ml:ci ./ml
